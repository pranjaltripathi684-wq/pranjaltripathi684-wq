<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Pranjal Tripathi: cybersecurity, backend and AI tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a3d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .ring{transform-origin:960px 150px;animation:spin 24s linear infinite}
      .ring2{transform-origin:960px 150px;animation:spin 36s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- shield + radar motif -->
  <g class="ring2" opacity="0.5">
    <circle cx="960" cy="150" r="118" fill="none" stroke="#1f3b57" stroke-width="1.5" stroke-dasharray="4 10"/>
  </g>
  <g class="ring">
    <circle cx="960" cy="150" r="92" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="120 460" stroke-linecap="round"/>
  </g>
  <circle cx="960" cy="150" r="66" fill="none" stroke="#1f3b57" stroke-width="1.5"/>
  <path d="M960 102 L998 116 V148 C998 174 982 192 960 202 C938 192 922 174 922 148 V116 Z"
        fill="#0b1220" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M944 150 L956 162 L978 138" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1052" cy="104" r="4" fill="#22d3ee" class="pulse"/>
  <circle cx="872" cy="210" r="3" fill="#3b82f6" class="pulse" style="animation-delay:.8s"/>
  <circle cx="1040" cy="214" r="3" fill="#22d3ee" class="pulse" style="animation-delay:1.6s"/>

  <!-- text -->
  <text x="64" y="86" class="mono" font-size="17" fill="#22d3ee">~$ whoami</text>
  <text x="62" y="146" class="sans" font-size="54" font-weight="700" fill="#e6edf6">Pranjal Tripathi</text>
  <rect x="64" y="164" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="204" class="sans" font-size="21" fill="#9fb0c6">Cybersecurity  ·  Backend engineering  ·  AI-powered tools</text>
  <text x="64" y="246" class="mono" font-size="16" fill="#5f7591">building things that defend, detect and explain</text>
  <rect x="532" y="232" width="10" height="18" fill="#22d3ee" class="cursor"/>
</svg>
